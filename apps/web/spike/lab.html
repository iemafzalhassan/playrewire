<!doctype html>
<meta charset="utf-8" />
<title>lab.wasm cold start</title>
<pre id="out">running...</pre>
<script type="module">
  // Task 4 spike: runs the REAL browser code path (webRunner.ts + worker.ts,
  // compiled by tsc into spike/.build by measure-lab*.{mjs,sh}; see build-spike.sh).
  import { createRunner, browserWorkerFactory } from "/spike/.build/webRunner.js";
  const q0 = new URLSearchParams(location.search);
  const base = location.origin + "/public/lab/";
  const workerUrl = new URL("/spike/.build/worker.js", location.href);
  const runner = createRunner(() => browserWorkerFactory(workerUrl, base), base);
  const hello = [{ name: "main.go", source: 'package main\nimport "fmt"\nfunc main() { fmt.Println("hi") }\n' }];
  const loop = [{ name: "main.go", source: "package main\nfunc main() { for {} }\n" }];
  const report = (o) => {
    document.getElementById("out").textContent = JSON.stringify(o);
    const q = new URLSearchParams(Object.entries(o).map(([k, v]) => [k, String(v)]));
    q.set("ua", navigator.userAgent);
    fetch("/__lab?" + q);
  };
  try {
    const t0 = performance.now();
    const r = await runner.run(hello);
    const cold = Math.round(performance.now() - t0);
    const t1 = performance.now();
    const k = await runner.run(loop, { wallMs: 1000 });
    const killMs = Math.round(performance.now() - t1);
    const again = await runner.run(hello);
    report({
      cold_ms: cold, stdout: JSON.stringify(r.stdout), stderr: JSON.stringify(r.stderr).slice(0, 300),
      loop_timedOut: k.timedOut, loop_ms: killMs, after_kill_stdout: JSON.stringify(again.stdout),
    });
  } catch (e) {
    report({ error: String(e).slice(0, 300) });
  }
</script>
