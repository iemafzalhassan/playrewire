[package]
name = "rewire-lab"
description = "Native Go runner for PlayRewire: the real Go toolchain inside a bubblewrap sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
flate2 = "1.1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.11"
tar = "0.4"
async-trait = "0.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt", "sync"] }

[dev-dependencies]
# 0.9.0 is under the 7-day supply-chain floor; stay on 0.8.3.
httpmock = "=0.8.3"
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt", "rt-multi-thread", "sync"] }
