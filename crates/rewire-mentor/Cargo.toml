[package]
name = "rewire-mentor"
description = "PlayRewire's bring-your-own-model mentor: provider presets, streaming hints as AG-UI events"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
futures-util = "0.3"
keyring = "4.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "macros", "rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# 0.9.0 is under the 7-day supply-chain floor; stay on 0.8.3 (same as rewire-lab).
httpmock = "=0.8.3"
tokio = { version = "1", features = ["time", "macros", "rt", "rt-multi-thread"] }
