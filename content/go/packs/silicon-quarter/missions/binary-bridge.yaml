id: binary-bridge
concept: reading-bits
terminal: bridge-panel
title: Show 13 on the Binary Bridge
setup: |
  package main

  // The Binary Bridge has 8 lamps, numbered 0 to 7 from left to right.
  // Lamp 0 shows the leftmost (biggest) binary digit.
levels:
  fill_blank:
    template: |
      // Light the bridge lamps so they show the number 13 in binary.
      // Lamp(i, on) turns lamp i on (true) or off (false).
      bits := fmt.Sprintf("%08b", 13)
      for i := 0; i < 8; i++ {
          Lamp(i, ___)
      }
    solution: |
      bits := fmt.Sprintf("%08b", 13)
      for i := 0; i < 8; i++ {
          Lamp(i, bits[i] == '1')
      }
  half_function:
    template: |
      // Light the bridge lamps so they show the number 13 in binary.
      // Lamp(i, on) turns lamp i on (true) or off (false).
      bits := fmt.Sprintf("%08b", 13)
      // Go through lamps 0 to 7. Turn each one on when its digit is a 1.
    solution: |
      bits := fmt.Sprintf("%08b", 13)
      for i := 0; i < 8; i++ {
          Lamp(i, bits[i] == '1')
      }
  blank_with_hints:
    template: ""
    solution: |
      bits := fmt.Sprintf("%08b", 13)
      for i := 0; i < 8; i++ {
          Lamp(i, bits[i] == '1')
      }
expect_events:
  - {op: lamp, i: 0, on: false}
  - {op: lamp, i: 1, on: false}
  - {op: lamp, i: 2, on: false}
  - {op: lamp, i: 3, on: false}
  - {op: lamp, i: 4, on: true}
  - {op: lamp, i: 5, on: true}
  - {op: lamp, i: 6, on: false}
  - {op: lamp, i: 7, on: true}
