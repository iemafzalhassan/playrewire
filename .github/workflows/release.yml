name: release

# Runs only when a maintainer pushes a version tag such as v0.1.0. The release
# it creates is a draft: the owner reviews it and publishes it by hand.
on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tag matches the app version
        id: version
        run: |
          ver=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' apps/desktop/src-tauri/tauri.conf.json)
          cargo_ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$ver" != "$GITHUB_REF_NAME" ] || [ "$ver" != "$cargo_ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME, tauri.conf.json $ver and Cargo.toml $cargo_ver must agree"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: SBOM (SPDX JSON, from the lockfiles)
        # Before the build, so it lists Cargo.lock, pnpm-lock.yaml and go.sum
        # rather than everything under target/ and node_modules/.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: rewire-${{ steps.version.outputs.version }}.spdx.json
          syft-version: v1.54.1
          upload-artifact: false
          upload-release-assets: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"
          # No cache: the release builds from a clean slate.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0,wasm-bindgen@0.2.129
      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.12.3 --locked
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf file bubblewrap xvfb
      - run: pnpm install --frozen-lockfile
      - name: Build (wasm, content, web, deb/rpm/AppImage, web tarball)
        run: just bundle
      # The real test of the AppArmor profile: this runner restricts
      # unprivileged user namespaces (unlike ci.yml, nothing turns that off
      # here), so the sandbox only starts if the deb's profile works.
      - name: Smoke test the deb
        run: |
          # Without both of these the smoke test would prove nothing.
          restrict=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)
          if [ "$restrict" != 1 ]; then
            echo "::error::apparmor_restrict_unprivileged_userns is '$restrict', expected 1"
            exit 1
          fi
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
          if ! sudo aa-status | grep -qx '[[:space:]]*dev\.playrewire\.rewire'; then
            echo "::error::the dev.playrewire.rewire AppArmor profile is not loaded"
            sudo aa-status
            exit 1
          fi
          test -x /usr/lib/rewire/bwrap
          cmp /usr/bin/bwrap /usr/lib/rewire/bwrap
          REWIRE_GO_ROOT="$(go env GOROOT)" xvfb-run -a rewire --smoke | tee smoke.txt
          grep -qx "SMOKE OK" smoke.txt
      # After the deb, so it finds the profiled /usr/lib/rewire/bwrap. This
      # checks that the AppImage built here starts on Ubuntu 24.04.
      - name: Smoke test the AppImage
        run: |
          appimage=$(ls target/release/bundle/appimage/*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 REWIRE_GO_ROOT="$(go env GOROOT)" xvfb-run -a "$appimage" --smoke | tee smoke-appimage.txt
          grep -qx "SMOKE OK" smoke-appimage.txt
      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm \
            target/release/bundle/appimage/*.AppImage \
            "target/release/bundle/web/rewire-web-$VERSION.tar.gz" \
            "rewire-$VERSION.spdx.json" release/
          ls -l release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Keyless cosign: the job's OIDC token is the signing identity.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - name: SHA256SUMS
        working-directory: release
        run: |
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign SHA256SUMS (keyless)
        run: cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS
      - name: Verify the signature
        run: |
          cosign verify-blob --bundle SHA256SUMS.cosign.bundle \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signature
          path: |
            SHA256SUMS
            SHA256SUMS.cosign.bundle
          if-no-files-found: error

  publish:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ls -l out
          prerelease=false
          case "$VERSION" in *-*) prerelease=true ;; esac
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --prerelease="$prerelease" \
            --title "Rewire $VERSION" \
            --generate-notes
