name: Bug report
description: Something isn't working as expected
labels: ["kind/bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this! For security issues, please use SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Type …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Linux, Windows, macOS, Android, iOS, Web]
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
